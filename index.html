<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT GIWA - DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #d4af37; --bg: #0a0e27; --bg-secondary: #141b3a;
            --bg-tertiary: #1a2847; --text: #e8e8e8; --text-muted: #a0a0a0;
            --accent: #7c3aed; --success: #10b981; --danger: #ef4444;
            --border: #2a3f5f; --task-blue: #00d4ff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f1535 100%);
            color: var(--text); min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.9), rgba(26, 40, 71, 0.9));
            border-bottom: 2px solid var(--primary);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select, button {
            background: var(--bg-tertiary);
            color: var(--text);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover:not(:disabled) {
            background: var(--primary);
            color: var(--bg);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .wallet-info {
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }
        .balance-display {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
        .token-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .token-row:last-child { border-bottom: none; }
        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
        }
        .info-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .quick-buttons {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
        }
        .quick-btn:hover { border-color: var(--primary); color: var(--primary); }
        .reverse-btn {
            padding: 8px 12px;
            background: var(--accent);
            border: 1px solid var(--accent);
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
            word-break: break-all;
            font-size: 12px;
        }
        .status.success { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .status.error { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .status.loading { background: rgba(0, 212, 255, 0.1); border-color: var(--task-blue); color: var(--task-blue); }
        .task-item {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--task-blue);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item.completed {
            border-left-color: var(--success);
            opacity: 0.7;
        }
        .task-btn {
            background: var(--task-blue);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .task-btn.done {
            background: var(--success);
        }
        .nft-preview {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 3px solid var(--primary);
            border-radius: 12px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--bg-tertiary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🚀 UPBIT GIWA</div>
            <div class="header-controls">
                <button onclick="connectWallet()"><span id="walletBtn">Connect Wallet</span></button>
            </div>
        </div>
        <div class="wallet-info" id="walletInfo" style="display: none;">
            <div>📍 <span id="chainName">--</span> | <span id="walletAddress"></span></div>
            <div id="chainWarning" style="color: var(--danger); margin-top: 5px;"></div>
        </div>
    </header>

    <main>
        <div class="tabs" id="tabs"></div>
        
        <!-- FAUCET -->
        <div id="faucet" class="tab-content active">
            <div class="card">
                <h2>💧 Faucets</h2>
                <div class="balance-display" id="faucetBalances"></div>
                <div class="input-group">
                    <select id="faucetToken" onchange="updateFaucetUI()">
                        <option value="rry">RRY - 100 tokens</option>
                        <option value="ang">ANG - 100 tokens</option>
                        <option value="knh">KNH - 100 tokens</option>
                    </select>
                </div>
                <div class="info-box">Next claim: <span id="faucetTimer">--:--:--</span></div>
                <button id="claimBtn" onclick="claimTokens()" style="width:100%; padding:15px; margin:15px 0;">Claim Tokens (Real TX)</button>
                <div id="faucetStatus"></div>
            </div>
        </div>
        
        <!-- SWAP -->
        <div id="swap" class="tab-content">
            <div class="card">
                <h2>⚡ Swap</h2>
                <div class="balance-display" id="swapBalances"></div>
                <div class="input-group">
                    <input type="number" id="swapAmount" placeholder="Amount" min="0" onchange="calcSwapOutput()">
                    <select id="swapTokenIn" onchange="calcSwapOutput()">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                    <button class="reverse-btn" onclick="reverseSwapTokens()">⇅</button>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setSwapPercent(25)">25%</button>
                    <button class="quick-btn" onclick="setSwapPercent(50)">50%</button>
                    <button class="quick-btn" onclick="setSwapPercent(75)">75%</button>
                    <button class="quick-btn" onclick="setSwapPercent(100)">100%</button>
                </div>
                <div class="info-box">Receive: <span id="swapOutput">0</span> <span id="swapOutToken">ANG</span> (0.25% fee)</div>
                <div class="input-group">
                    <select id="swapTokenOut">
                        <option value="ang">ANG</option>
                        <option value="rry">RRY</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <button onclick="executeSwap()" style="width:100%; padding:15px; margin:15px 0;">Swap (Real TX)</button>
                <div id="swapStatus"></div>
            </div>
        </div>
        
        <!-- BRIDGE -->
        <div id="bridge" class="tab-content">
            <div class="card">
                <h2>🌉 Bridge</h2>
                <div id="bridgeBalances"></div>
                <div class="input-group">
                    <select id="bridgeSourceChain" onchange="updateBridgePath()">
                        <option value="giwa">From GIWA</option>
                        <option value="arc">From ARC</option>
                    </select>
                    <select id="bridgeDestChain" onchange="updateBridgePath()">
                        <option value="arc">To ARC</option>
                        <option value="giwa">To GIWA</option>
                    </select>
                    <button class="reverse-btn" onclick="reverseBridgeChains()">⇅</button>
                </div>
                <div class="info-box">Path: <span id="bridgePath">GIWA → ARC</span> | Fee: 0.50%</div>
                <div class="input-group">
                    <input type="number" id="bridgeAmount" placeholder="Amount" min="0">
                    <select id="bridgeToken">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setBridgePercent(25)">25%</button>
                    <button class="quick-btn" onclick="setBridgePercent(50)">50%</button>
                    <button class="quick-btn" onclick="setBridgePercent(75)">75%</button>
                    <button class="quick-btn" onclick="setBridgePercent(100)">100%</button>
                </div>
                <button onclick="executeBridge()" style="width:100%; padding:15px; margin:15px 0;">Bridge (Real TX)</button>
                <div id="bridgeStatus"></div>
            </div>
        </div>
        
        <!-- NFT -->
        <div id="nft" class="tab-content">
            <div class="card">
                <h2>🎮 Checkmate NFT</h2>
                <div class="nft-preview" style="background-image: url('https://i.ibb.co/fVHjPmxn/checkmate-pfp-1763142640689.png');"></div>
                <div class="info-box">Minted: <span id="nftSupply">0</span> / 9999</div>
                <div class="input-group">
                    <input type="text" id="nftName" placeholder="NFT Name (optional)">
                </div>
                <button onclick="mintNFT()" style="width:100%; padding:15px; margin:15px 0;">Mint NFT (Real TX)</button>
                <div id="nftStatus"></div>
            </div>
        </div>
        
        <!-- GM -->
        <div id="gm" class="tab-content">
            <div class="card">
                <h2>✨ GM</h2>
                <div style="font-size:48px; text-align:center; margin:20px 0; color:var(--primary);">GM ☀️</div>
                <div style="text-align:center; font-size:18px; color:var(--task-blue);">Reset: <span id="gmTimer">00:00:00</span></div>
                <div style="text-align:center; margin:20px 0;">Streak: <span id="gmStreak" style="color:var(--primary); font-size:24px;">0</span> days</div>
                <button onclick="gmCheckIn()" style="width:100%; padding:20px; margin:15px 0; font-size:18px;">Say GM! ☀️</button>
                <div id="gmStatus"></div>
            </div>
        </div>
        
        <!-- TASKS -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h2>📋 Tasks</h2>
                <div id="tasksContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIG ====================
        const CHAINS = {
            giwa: { id: '0x1a6a9d2', name: 'GIWA', rpc: 'https://rpc.testnet.chain.giwa.io' },
            arc: { id: '0x4cef52', name: 'ARC', rpc: 'https://arc-testnet.drpc.org' }
        };

        const CONTRACTS = {
            giwa: {
                faucetRry: '0x9ee860D517E1107ADfD5a4ba8ED4c44770F196F8',
                faucetAng: '0x290d07b026fb39302Bf47d7bfACcFF3b2dAAf3eD',
                faucetKnh: '0xA90f50c80B5899Fcb0A99595031bb4D2f08A65CB',
                rry: '0x2Ab6E0364593C59018C49130602B4fBBEE77eEBd',
                ang: '0x5d28Df1Fd08981347caF44C4f94C8B57458d1e85',
                knh: '0xFb6dcAdd47176dab6E24bB93fc3B61bF3FFbfB00',
                swap: '0x571B477afB798B9806EA1094b706210899E1665e',
                nft: '0x4034195d2A198394b664c1d256805f0Dd20c2571'
            },
            arc: {
                faucetRry: '0xA3D3C681Cb511d05337cEAfB5934551746b7ec51',
                faucetAng: '0x10b7049da0691f294D742a3A457Ea6F137dBABD1',
                faucetKnh: '0xe097481fFC700a05B22d653E7aE4Bc022dFCe9ab',
                rry: '0x998686e27444Ec1b4700299f2222A9Dd27eC9eeA',
                ang: '0x25832a57D698C9072C71aA735Be2D11A48e9a1A6',
                knh: '0x2121C6c9EEfEA700831b16Ba5791a145599fb54B',
                swap: '0xFcfe1D1BF3083ACf627d04c2Ca0cE0B43335fC2e',
                nft: '0x4766EC9193a4F89F9d417AcEcBaf9aaC7dB93A70'
            }
        };

        const FAUCET_ABI = ['function claimTokens() public', 'function timeUntilNextClaim(address user) public view returns (uint256)'];
        const ERC20_ABI = ['function balanceOf(address) public view returns (uint256)', 'function approve(address spender, uint256 amount) public returns (bool)', 'function transfer(address to, uint256 amount) public returns (bool)'];
        const NFT_ABI = ['function mint(address to, string nftName) public', 'function totalSupply() public view returns (uint256)'];
        const SWAP_ABI = ['function swapTokens(address tokenIn, uint256 amountIn, address tokenOut) public returns (uint256)'];
        const BRIDGE_ABI = ['function startBridge(address token, uint256 amount, string sourceChain, string destinationChain) public returns (uint256)'];

        // ==================== STATE ====================
        let currentChain = 'giwa';
        let currentChainId = CHAINS.giwa.id;
        let userAddress = null;
        let provider = null;
        let signer = null;
        let gmStreak = 0;
        let lastGMDate = null;
        let faucetClaims = {};
        let completedTasks = {};

        const TABS = ['faucet', 'swap', 'bridge', 'nft', 'gm', 'tasks'];
        const TAB_LABELS = { faucet: '💧 Faucet', swap: '⚡ Swap', bridge: '🌉 Bridge', nft: '🎮 NFT', gm: '✨ GM', tasks: '📋 Tasks' };
        const TASKS_LIST = [
            { name: 'Say GM', icon: '☀️', points: 10, action: 'gm' },
            { name: 'Claim Tokens', icon: '💧', points: 20, action: 'faucet' },
            { name: 'Swap Tokens', icon: '⚡', points: 30, action: 'swap' },
            { name: 'Bridge Tokens', icon: '🌉', points: 40, action: 'bridge' },
            { name: 'Mint NFT', icon: '🎮', points: 50, action: 'nft' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTasks();
            loadLocalData();
            updateGMTimer();
            setInterval(updateGMTimer, 1000);
            setInterval(updateFaucetUI, 1000);
            window.ethereum?.on('chainChanged', () => location.reload());
            window.ethereum?.on('accountsChanged', () => location.reload());
        });

        function renderTabs() {
            document.getElementById('tabs').innerHTML = TABS.map(tab => 
                `<button class="tab-btn ${tab === 'faucet' ? 'active' : ''}" onclick="switchTab('${tab}')">${TAB_LABELS[tab]}</button>`
            ).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            updateAllBalances();
        }

        // ==================== WALLET ====================
        async function connectWallet() {
            if (!window.ethereum) return alert('Install MetaMask!');
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                
                const network = await provider.getNetwork();
                currentChainId = '0x' + network.chainId.toString(16);
                
                // Detect chain
                for (const [chain, config] of Object.entries(CHAINS)) {
                    if (config.id === currentChainId) {
                        currentChain = chain;
                        break;
                    }
                }

                document.getElementById('walletBtn').textContent = 'Connected ✓';
                document.getElementById('walletAddress').textContent = userAddress;
                document.getElementById('chainName').textContent = CHAINS[currentChain].name;
                document.getElementById('walletInfo').style.display = 'block';

                checkChainWarning();
                updateAllBalances();
            } catch (error) { 
                showStatus('error', 'Connection failed', 'faucetStatus');
            }
        }

        function checkChainWarning() {
            const warning = document.getElementById('chainWarning');
            const validChains = ['0x1a6a9d2', '0x4cef52'];
            if (!validChains.includes(currentChainId)) {
                warning.innerHTML = '⚠️ Wrong chain! Switch to GIWA or ARC in MetaMask';
            } else {
                warning.innerHTML = '';
            }
        }

        // ==================== BALANCE FETCHING ====================
        async function updateAllBalances() {
            if (!signer) return;

            const contracts = CONTRACTS[currentChain];
            const balanceHtml = `
                <div class="token-row"><span>RRY:</span> <strong id="balRry">...</strong></div>
                <div class="token-row"><span>ANG:</span> <strong id="balAng">...</strong></div>
                <div class="token-row"><span>KNH:</span> <strong id="balKnh">...</strong></div>
            `;

            document.getElementById('faucetBalances').innerHTML = balanceHtml;
            document.getElementById('swapBalances').innerHTML = balanceHtml;

            // Bridge shows both chains
            const balanceHtmlBridge = `
                <div style="margin-bottom: 10px;"><strong>${CHAINS.giwa.name}:</strong>
                    <div class="token-row"><span>RRY:</span> <strong id="balGiwaRry">...</strong></div>
                    <div class="token-row"><span>ANG:</span> <strong id="balGiwaAng">...</strong></div>
                    <div class="token-row"><span>KNH:</span> <strong id="balGiwaKnh">...</strong></div>
                </div>
                <div><strong>${CHAINS.arc.name}:</strong>
                    <div class="token-row"><span>RRY:</span> <strong id="balArcRry">...</strong></div>
                    <div class="token-row"><span>ANG:</span> <strong id="balArcAng">...</strong></div>
                    <div class="token-row"><span>KNH:</span> <strong id="balArcKnh">...</strong></div>
                </div>
            `;
            document.getElementById('bridgeBalances').innerHTML = balanceHtmlBridge;

            // Fetch balances
            try {
                const rry = new ethers.Contract(contracts.rry, ERC20_ABI, signer);
                const ang = new ethers.Contract(contracts.ang, ERC20_ABI, signer);
                const knh = new ethers.Contract(contracts.knh, ERC20_ABI, signer);

                const [rryBal, angBal, knhBal] = await Promise.all([
                    rry.balanceOf(userAddress),
                    ang.balanceOf(userAddress),
                    knh.balanceOf(userAddress)
                ]);

                const fmt = (val) => (parseInt(val) / 1e18).toFixed(2);
                document.getElementById('balRry').textContent = fmt(rryBal);
                document.getElementById('balAng').textContent = fmt(angBal);
                document.getElementById('balKnh').textContent = fmt(knhBal);

                // Bridge - fetch both chains
                const providerGiwa = new ethers.JsonRpcProvider(CHAINS.giwa.rpc);
                const providerArc = new ethers.JsonRpcProvider(CHAINS.arc.rpc);

                const rryGiwa = new ethers.Contract(CONTRACTS.giwa.rry, ERC20_ABI, providerGiwa);
                const angGiwa = new ethers.Contract(CONTRACTS.giwa.ang, ERC20_ABI, providerGiwa);
                const knhGiwa = new ethers.Contract(CONTRACTS.giwa.knh, ERC20_ABI, providerGiwa);

                const rryArc = new ethers.Contract(CONTRACTS.arc.rry, ERC20_ABI, providerArc);
                const angArc = new ethers.Contract(CONTRACTS.arc.ang, ERC20_ABI, providerArc);
                const knhArc = new ethers.Contract(CONTRACTS.arc.knh, ERC20_ABI, providerArc);

                const [giwaRry, giwaAng, giwaKnh, arcRry, arcAng, arcKnh] = await Promise.all([
                    rryGiwa.balanceOf(userAddress),
                    angGiwa.balanceOf(userAddress),
                    knhGiwa.balanceOf(userAddress),
                    rryArc.balanceOf(userAddress),
                    angArc.balanceOf(userAddress),
                    knhArc.balanceOf(userAddress)
                ]);

                document.getElementById('balGiwaRry').textContent = fmt(giwaRry);
                document.getElementById('balGiwaAng').textContent = fmt(giwaAng);
                document.getElementById('balGiwaKnh').textContent = fmt(giwaKnh);
                document.getElementById('balArcRry').textContent = fmt(arcRry);
                document.getElementById('balArcAng').textContent = fmt(arcAng);
                document.getElementById('balArcKnh').textContent = fmt(arcKnh);

            } catch (error) {
                console.log('Balance fetch error:', error.message);
            }
        }

        // ==================== FAUCET ====================
        function updateFaucetUI() {
            const token = document.getElementById('faucetToken')?.value || 'rry';
            const key = `faucet_${token}_${currentChain}`;
            const lastClaim = faucetClaims[key] || 0;
            const now = Math.floor(Date.now() / 1000);
            const nextClaim = lastClaim + 86400;

            if (now >= nextClaim) {
                document.getElementById('faucetTimer').textContent = 'Ready!';
                document.getElementById('claimBtn').disabled = false;
            } else {
                const left = nextClaim - now;
                const h = Math.floor(left / 3600);
                const m = Math.floor((left % 3600) / 60);
                const s = left % 60;
                document.getElementById('faucetTimer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                document.getElementById('claimBtn').disabled = true;
            }
        }

        async function claimTokens() {
            if (!userAddress || !signer) return showStatus('error', 'Connect wallet!', 'faucetStatus');

            const token = document.getElementById('faucetToken').value;
            const contracts = CONTRACTS[currentChain];
            const faucetAddr = token === 'rry' ? contracts.faucetRry : token === 'ang' ? contracts.faucetAng : contracts.faucetKnh;

            try {
                showStatus('loading', 'Claiming... (waiting for TX)', 'faucetStatus');
                const faucet = new ethers.Contract(faucetAddr, FAUCET_ABI, signer);
                const tx = await faucet.claimTokens();
                const receipt = await tx.wait();

                const key = `faucet_${token}_${currentChain}`;
                faucetClaims[key] = Math.floor(Date.now() / 1000);
                completeTask('faucet');
                saveLocalData();
                updateFaucetUI();
                updateAllBalances();

                showStatus('success', `✅ Claimed 100 ${token.toUpperCase()}!\nTX: ${receipt.hash}`, 'faucetStatus');
            } catch (error) {
                showStatus('error', 'Claim failed: ' + (error.reason || error.message.substring(0, 100)), 'faucetStatus');
            }
        }

        // ==================== SWAP ====================
        function setSwapPercent(percent) {
            const balance = parseFloat(document.getElementById('balRry').textContent) || 0;
            document.getElementById('swapAmount').value = (balance * percent / 100).toFixed(2);
            calcSwapOutput();
        }

        function calcSwapOutput() {
            const amount = parseFloat(document.getElementById('swapAmount').value) || 0;
            const output = amount * 0.9975;
            document.getElementById('swapOutput').textContent = output.toFixed(2);
            document.getElementById('swapOutToken').textContent = document.getElementById('swapTokenOut').value.toUpperCase();
        }

        function reverseSwapTokens() {
            const tokenIn = document.getElementById('swapTokenIn').value;
            const tokenOut = document.getElementById('swapTokenOut').value;
            document.getElementById('swapTokenIn').value = tokenOut;
            document.getElementById('swapTokenOut').value = tokenIn;
            calcSwapOutput();
        }

        async function executeSwap() {
            if (!userAddress || !signer) return showStatus('error', 'Connect wallet!', 'swapStatus');
            
            const amount = parseFloat(document.getElementById('swapAmount').value);
            if (!amount) return showStatus('error', 'Enter amount!', 'swapStatus');

            const tokenIn = document.getElementById('swapTokenIn').value;
            const tokenOut = document.getElementById('swapTokenOut').value;
            const contracts = CONTRACTS[currentChain];

            try {
                showStatus('loading', 'Swapping... (waiting for TX)', 'swapStatus');

                // Approve + Swap
                const tokenInAddr = tokenIn === 'rry' ? contracts.rry : tokenIn === 'ang' ? contracts.ang : contracts.knh;
                const tokenOutAddr = tokenOut === 'rry' ? contracts.rry : tokenOut === 'ang' ? contracts.ang : contracts.knh;
                const amountWei = ethers.parseEther(amount.toString());

                const token = new ethers.Contract(tokenInAddr, ERC20_ABI, signer);
                const approveTx = await token.approve(contracts.swap, amountWei);
                await approveTx.wait();

                const swap = new ethers.Contract(contracts.swap, SWAP_ABI, signer);
                const tx = await swap.swapTokens(tokenInAddr, amountWei, tokenOutAddr);
                const receipt = await tx.wait();

                completeTask('swap');
                saveLocalData();
                updateAllBalances();

                showStatus('success', `✅ Swapped ${amount} ${tokenIn.toUpperCase()}!\nTX: ${receipt.hash}`, 'swapStatus');
                document.getElementById('swapAmount').value = '';
                calcSwapOutput();
            } catch (error) {
                showStatus('error', 'Swap failed: ' + (error.reason || error.message.substring(0, 100)), 'swapStatus');
            }
        }

        // ==================== BRIDGE ====================
        function updateBridgePath() {
            const source = document.getElementById('bridgeSourceChain').value;
            const dest = document.getElementById('bridgeDestChain').value;
            document.getElementById('bridgePath').textContent = `${source.toUpperCase()} → ${dest.toUpperCase()}`;
        }

        function reverseBridgeChains() {
            const source = document.getElementById('bridgeSourceChain').value;
            const dest = document.getElementById('bridgeDestChain').value;
            document.getElementById('bridgeSourceChain').value = dest;
            document.getElementById('bridgeDestChain').value = source;
            updateBridgePath();
        }

        function setBridgePercent(percent) {
            const balId = `bal${currentChain.charAt(0).toUpperCase() + currentChain.slice(1)}${document.getElementById('bridgeToken').value.toUpperCase()}`;
            const balance = parseFloat(document.getElementById(balId)?.textContent) || 0;
            document.getElementById('bridgeAmount').value = (balance * percent / 100).toFixed(2);
        }

        async function executeBridge() {
            if (!userAddress || !signer) return showStatus('error', 'Connect wallet!', 'bridgeStatus');
            
            const amount = parseFloat(document.getElementById('bridgeAmount').value);
            if (!amount) return showStatus('error', 'Enter amount!', 'bridgeStatus');

            const sourceChain = document.getElementById('bridgeSourceChain').value;
            const destChain = document.getElementById('bridgeDestChain').value;
            const token = document.getElementById('bridgeToken').value;
            const contracts = CONTRACTS[sourceChain];

            try {
                showStatus('loading', 'Bridging... (waiting for TX)', 'bridgeStatus');

                const tokenAddr = token === 'rry' ? contracts.rry : token === 'ang' ? contracts.ang : contracts.knh;
                const amountWei = ethers.parseEther(amount.toString());

                // Approve + Bridge
                const tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
                const approveTx = await tokenContract.approve(contracts.swap, amountWei);
                await approveTx.wait();

                const bridge = new ethers.Contract(contracts.swap, BRIDGE_ABI, signer);
                const tx = await bridge.startBridge(tokenAddr, amountWei, sourceChain.toUpperCase(), destChain.toUpperCase());
                const receipt = await tx.wait();

                completeTask('bridge');
                saveLocalData();
                updateAllBalances();

                showStatus('success', `✅ Bridged ${amount} ${token.toUpperCase()} ${sourceChain.toUpperCase()} → ${destChain.toUpperCase()}!\nTX: ${receipt.hash}`, 'bridgeStatus');
                document.getElementById('bridgeAmount').value = '';
            } catch (error) {
                showStatus('error', 'Bridge failed: ' + (error.reason || error.message.substring(0, 100)), 'bridgeStatus');
            }
        }

        // ==================== NFT ====================
        async function mintNFT() {
            if (!userAddress || !signer) return showStatus('error', 'Connect wallet!', 'nftStatus');

            try {
                showStatus('loading', 'Minting NFT... (waiting for TX)', 'nftStatus');
                const contracts = CONTRACTS[currentChain];
                const nft = new ethers.Contract(contracts.nft, NFT_ABI, signer);
                
                const name = document.getElementById('nftName').value || 'Checkmate #' + Math.floor(Math.random() * 9999);
                const tx = await nft.mint(userAddress, name);
                const receipt = await tx.wait();

                completeTask('nft');
                saveLocalData();

                showStatus('success', `✅ Minted "${name}"!\nTX: ${receipt.hash}`, 'nftStatus');
                document.getElementById('nftName').value = '';
            } catch (error) {
                showStatus('error', 'Mint failed: ' + (error.reason || error.message.substring(0, 100)), 'nftStatus');
            }
        }

        // ==================== GM ====================
        function gmCheckIn() {
            const today = new Date().toDateString();
            if (lastGMDate === today) return showStatus('error', 'Already checked in!', 'gmStatus');

            lastGMDate = today;
            gmStreak++;
            document.getElementById('gmStreak').textContent = gmStreak;
            completeTask('gm');
            saveLocalData();
            showStatus('success', `✨ GM! Streak: ${gmStreak}`, 'gmStatus');
        }

        function updateGMTimer() {
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 86400000);
            tomorrow.setHours(0, 0, 0, 0);
            const diff = tomorrow - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('gmTimer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ==================== TASKS ====================
        function renderTasks() {
            document.getElementById('tasksContainer').innerHTML = TASKS_LIST.map(task => {
                const today = new Date().toDateString();
                const key = `${task.action}_${today}`;
                const done = completedTasks[key];
                return `
                    <div class="task-item ${done ? 'completed' : ''}">
                        <div><span style="font-size:24px; margin-right:10px;">${task.icon}</span>${task.name} <span style="color:var(--task-blue); margin-left:10px;">+${task.points}pts</span></div>
                        <button class="task-btn ${done ? 'done' : ''}" ${done ? 'disabled' : ''}>${done ? '✓ Done' : 'Complete'}</button>
                    </div>
                `;
            }).join('');
        }

        function completeTask(action) {
            const today = new Date().toDateString();
            completedTasks[`${action}_${today}`] = true;
            renderTasks();
        }

        // ==================== UTILS ====================
        function showStatus(type, msg, id) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            document.getElementById(id).innerHTML = '';
            document.getElementById(id).appendChild(div);
            if (type !== 'loading') setTimeout(() => div.remove(), 10000);
        }

        function saveLocalData() {
            localStorage.setItem('gmStreak', gmStreak);
            localStorage.setItem('lastGMDate', lastGMDate);
            localStorage.setItem('faucetClaims', JSON.stringify(faucetClaims));
            localStorage.setItem('completedTasks', JSON.stringify(completedTasks));
        }

        function loadLocalData() {
            gmStreak = parseInt(localStorage.getItem('gmStreak')) || 0;
            lastGMDate = localStorage.getItem('lastGMDate');
            faucetClaims = JSON.parse(localStorage.getItem('faucetClaims')) || {};
            completedTasks = JSON.parse(localStorage.getItem('completedTasks')) || {};
            document.getElementById('gmStreak').textContent = gmStreak;
            renderTasks();
        }
    </script>
</body>
</html>
