<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT DApp - Multi-Chain</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --cyan: #00d4ff;
            --dark-bg: #0a0e27;
            --card-bg: #141b3a;
            --text: #e8e8e8;
            --muted: #a0a0a0;
            --success: #10b981;
            --error: #ef4444;
            --border: #1a3a52;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #0f1535 100%);
            color: var(--text);
            min-height: 100vh;
        }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.95), rgba(10, 14, 39, 0.95));
            border-bottom: 3px solid var(--cyan);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: var(--cyan);
            letter-spacing: 2px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 12px 20px;
            border: 2px solid var(--cyan);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled), select:hover {
            background: var(--cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-connect {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        
        .btn-connect:hover {
            background: rgba(16, 185, 129, 0.8);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        
        .wallet-info {
            background: var(--card-bg);
            border: 2px solid var(--cyan);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            color: var(--cyan);
            margin-top: 10px;
            display: none;
        }
        
        /* MAIN */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        
        .tab-btn.active {
            background: var(--cyan);
            color: var(--dark-bg);
            border-color: var(--cyan);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card {
            background: linear-gradient(135deg, var(--card-bg), rgba(0, 212, 255, 0.05));
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
        }
        
        .card h2 {
            color: var(--cyan);
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid var(--cyan);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        input, select {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
        }
        
        input:focus, select:focus {
            border-color: var(--cyan);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        
        .btn-primary {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            background: var(--cyan);
            border: 2px solid var(--cyan);
            color: var(--dark-bg);
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: transparent;
            color: var(--cyan);
        }
        
        .quick-btns {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .quick-btn:hover {
            background: var(--cyan);
            color: var(--dark-bg);
        }
        
        .balance-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--cyan);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .balance-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .balance-row:last-child { border-bottom: none; }
        .balance-row strong { color: var(--cyan); }
        
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
            font-size: 13px;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }
        
        .status.loading {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--cyan);
            color: var(--cyan);
        }
        
        .task-item {
            background: var(--card-bg);
            border-left: 4px solid var(--cyan);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-points { color: var(--cyan); font-weight: bold; }
        
        .streak { 
            font-size: 32px; 
            color: var(--cyan); 
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🚀 UPBIT</div>
            <div class="controls">
                <select id="chainSelect" onchange="switchChain()">
                    <option value="giwa">GIWA</option>
                    <option value="arc">ARC</option>
                    <option value="ink">INK</option>
                </select>
                <button class="btn-connect" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
            </div>
        </div>
        <div class="wallet-info" id="walletInfo">
            <div>🔗 <span id="chainDisplay"></span> | 👤 <span id="walletDisplay"></span></div>
        </div>
    </header>

    <main>
        <div class="tabs" id="tabs"></div>

        <!-- FAUCET -->
        <div id="faucet" class="tab-content active">
            <div class="card">
                <h2>💧 Get Testnet Tokens</h2>
                <div class="info-box">
                    Click the button below to open the official faucet for your chain
                </div>
                <button class="btn-primary" id="faucetBtn" onclick="openFaucet()">Open Faucet</button>
                <div id="faucetStatus"></div>
            </div>
        </div>

        <!-- SWAP -->
        <div id="swap" class="tab-content">
            <div class="card">
                <h2>⚡ Swap Tokens</h2>
                <div class="balance-box" id="swapBalance">Loading...</div>
                
                <div class="input-group">
                    <input type="number" id="swapAmount" placeholder="Amount" min="0" onchange="calcSwap()">
                    <select id="swapFrom">
                        <option value="native">Native</option>
                        <option value="token1">Token 1</option>
                        <option value="token2">Token 2</option>
                    </select>
                </div>
                
                <div class="quick-btns">
                    <button class="quick-btn" onclick="setSwapPercent(25)">25%</button>
                    <button class="quick-btn" onclick="setSwapPercent(50)">50%</button>
                    <button class="quick-btn" onclick="setSwapPercent(75)">75%</button>
                    <button class="quick-btn" onclick="setSwapPercent(100)">100%</button>
                </div>
                
                <div class="info-box">You get: <span id="swapOut">0</span></div>
                
                <button class="btn-primary" onclick="executeSwap()">Swap</button>
                <div id="swapStatus"></div>
            </div>
        </div>

        <!-- BRIDGE -->
        <div id="bridge" class="tab-content">
            <div class="card">
                <h2>🌉 Bridge Tokens</h2>
                
                <div class="input-group">
                    <select id="bridgeFrom">
                        <option value="giwa">From GIWA</option>
                        <option value="arc">From ARC</option>
                        <option value="ink">From INK</option>
                    </select>
                    <select id="bridgeTo">
                        <option value="arc">To ARC</option>
                        <option value="giwa">To GIWA</option>
                        <option value="ink">To INK</option>
                    </select>
                </div>
                
                <div class="info-box">Fee: 0.50%</div>
                
                <div class="input-group">
                    <input type="number" id="bridgeAmount" placeholder="Amount" min="0">
                </div>
                
                <div class="quick-btns">
                    <button class="quick-btn" onclick="setBridgePercent(25)">25%</button>
                    <button class="quick-btn" onclick="setBridgePercent(50)">50%</button>
                    <button class="quick-btn" onclick="setBridgePercent(75)">75%</button>
                    <button class="quick-btn" onclick="setBridgePercent(100)">100%</button>
                </div>
                
                <button class="btn-primary" onclick="executeBridge()">Bridge</button>
                <div id="bridgeStatus"></div>
            </div>
        </div>

        <!-- NFT -->
        <div id="nft" class="tab-content">
            <div class="card">
                <h2>🎮 Mint NFT (1x/day)</h2>
                <div style="text-align:center; font-size:64px; margin:30px 0;">🏁</div>
                
                <div class="info-box">
                    Minted: <span id="nftCount">0</span> / 9999
                    <br>Next Mint: <span id="nftTimer">--:--:--</span>
                </div>
                
                <div class="input-group">
                    <input type="text" id="nftName" placeholder="NFT Name (optional)">
                </div>
                
                <button class="btn-primary" id="nftBtn" onclick="mintNFT()">Mint NFT</button>
                <div id="nftStatus"></div>
            </div>
        </div>

        <!-- GM -->
        <div id="gm" class="tab-content">
            <div class="card">
                <h2>✨ Daily GM Check-in</h2>
                <div style="font-size:64px; text-align:center; margin:30px 0;">GM ☀️</div>
                <div class="streak" id="gmStreak">0</div>
                <div class="info-box">Reset: <span id="gmTimer">--:--:--</span></div>
                <button class="btn-primary" onclick="gmCheckIn()">Say GM! ☀️</button>
                <div id="gmStatus"></div>
            </div>
        </div>

        <!-- TASKS -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h2>📋 Daily Tasks</h2>
                <div id="tasksContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIG ====================
        const CHAINS = {
            giwa: { id: 27699666, name: 'GIWA', faucet: 'https://faucet.giwa.io/#/' },
            arc: { id: 5042002, name: 'ARC', faucet: 'https://faucet.circle.com/' },
            ink: { id: 763373, name: 'INK', faucet: 'https://faucet.circle.com/' }
        };

        const TABS = ['faucet', 'swap', 'bridge', 'nft', 'gm', 'tasks'];
        const TASKS = [
            { name: 'Say GM', icon: '☀️', points: 10 },
            { name: 'Use Faucet', icon: '💧', points: 20 },
            { name: 'Swap Tokens', icon: '⚡', points: 30 },
            { name: 'Bridge Tokens', icon: '🌉', points: 40 },
            { name: 'Mint NFT', icon: '🎮', points: 50 }
        ];

        // ==================== STATE ====================
        let currentChain = 'giwa';
        let userAddress = null;
        let provider = null;
        let gmStreak = 0;

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTasks();
            loadData();
            setInterval(updateTimers, 1000);
        });

        function renderTabs() {
            document.getElementById('tabs').innerHTML = TABS.map(t =>
                `<button class="tab-btn ${t === 'faucet' ? 'active' : ''}" onclick="switchTab('${t}')">${t.toUpperCase()}</button>`
            ).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // ==================== WALLET ====================
        async function connectWallet() {
            if (!window.ethereum) {
                alert('Install MetaMask!');
                return;
            }

            try {
                showStatus('loading', 'Connecting...', 'faucetStatus');
                const [addr] = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = addr;
                provider = new ethers.BrowserProvider(window.ethereum);
                
                updateDisplay();
                showStatus('success', '✅ Connected!', 'faucetStatus');
            } catch (e) {
                showStatus('error', 'Connection failed: ' + e.message, 'faucetStatus');
            }
        }

        async function switchChain() {
            const chain = document.getElementById('chainSelect').value;
            const chainId = '0x' + CHAINS[chain].id.toString(16);

            try {
                await window.ethereum.request({ 
                    method: 'wallet_switchEthereumChain', 
                    params: [{ chainId }] 
                });
                currentChain = chain;
                updateDisplay();
                showStatus('success', `✅ Switched to ${CHAINS[chain].name}!`, 'faucetStatus');
            } catch (e) {
                showStatus('error', 'Chain switch failed', 'faucetStatus');
                document.getElementById('chainSelect').value = currentChain;
            }
        }

        function updateDisplay() {
            if (!userAddress) return;
            document.getElementById('walletInfo').style.display = 'block';
            document.getElementById('chainDisplay').textContent = CHAINS[currentChain].name;
            document.getElementById('walletDisplay').textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
            document.getElementById('connectBtn').textContent = '✅ Connected';
            document.getElementById('connectBtn').disabled = true;
        }

        // ==================== FAUCET ====================
        function openFaucet() {
            const faucetUrl = CHAINS[currentChain].faucet;
            window.open(faucetUrl, '_blank');
            showStatus('success', '✅ Faucet opened in new tab!', 'faucetStatus');
        }

        // ==================== SWAP ====================
        function calcSwap() {
            const amt = parseFloat(document.getElementById('swapAmount').value) || 0;
            document.getElementById('swapOut').textContent = (amt * 0.9975).toFixed(2);
        }

        function setSwapPercent(p) {
            document.getElementById('swapAmount').value = p;
            calcSwap();
        }

        async function executeSwap() {
            showStatus('loading', 'Executing swap...', 'swapStatus');
            setTimeout(() => showStatus('success', '✅ Swap executed!', 'swapStatus'), 1500);
        }

        // ==================== BRIDGE ====================
        function setBridgePercent(p) {
            document.getElementById('bridgeAmount').value = p;
        }

        async function executeBridge() {
            showStatus('loading', 'Executing bridge...', 'bridgeStatus');
            setTimeout(() => showStatus('success', '✅ Bridge executed!', 'bridgeStatus'), 1500);
        }

        // ==================== NFT ====================
        function updateNFTTimer() {
            const today = new Date().toDateString();
            const minted = localStorage.getItem('nft-today') === today;

            if (minted) {
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(0, 0, 0, 0);
                const ms = tomorrow - now;
                document.getElementById('nftTimer').textContent = formatTime(ms);
                document.getElementById('nftBtn').disabled = true;
            } else {
                document.getElementById('nftBtn').disabled = false;
            }
        }

        async function mintNFT() {
            const today = new Date().toDateString();
            if (localStorage.getItem('nft-today') === today) {
                showStatus('error', 'Already minted today!', 'nftStatus');
                return;
            }

            localStorage.setItem('nft-today', today);
            showStatus('success', '✅ NFT Minted!', 'nftStatus');
            updateNFTTimer();
        }

        // ==================== GM ====================
        function updateGMTimer() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            const ms = tomorrow - now;
            document.getElementById('gmTimer').textContent = formatTime(ms);
        }

        function gmCheckIn() {
            const today = new Date().toDateString();
            if (localStorage.getItem('gm-today') === today) {
                showStatus('error', 'Already checked in!', 'gmStatus');
                return;
            }

            gmStreak++;
            localStorage.setItem('gm-today', today);
            localStorage.setItem('gm-streak', gmStreak);
            document.getElementById('gmStreak').textContent = gmStreak;
            showStatus('success', `✨ GM! Streak: ${gmStreak}`, 'gmStatus');
        }

        // ==================== TASKS ====================
        function renderTasks() {
            document.getElementById('tasksContainer').innerHTML = TASKS.map((t, i) =>
                `<div class="task-item">
                    <div><span style="font-size:20px; margin-right:10px;">${t.icon}</span>${t.name} <span class="task-points">+${t.points}pts</span></div>
                </div>`
            ).join('');
        }

        // ==================== UTILS ====================
        function updateTimers() {
            updateNFTTimer();
            updateGMTimer();
        }

        function formatTime(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function showStatus(type, msg, id) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = '';
                el.appendChild(div);
            }
            if (type !== 'loading') setTimeout(() => div.remove(), 8000);
        }

        function saveData() {
            localStorage.setItem('gm-streak', gmStreak);
        }

        function loadData() {
            gmStreak = parseInt(localStorage.getItem('gm-streak')) || 0;
            document.getElementById('gmStreak').textContent = gmStreak;
        }
    </script>
</body>
</html>
