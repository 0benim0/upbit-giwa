<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT GIWA - DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #d4af37; --bg: #0a0e27; --bg-secondary: #141b3a;
            --bg-tertiary: #1a2847; --text: #e8e8e8; --text-muted: #a0a0a0;
            --accent: #7c3aed; --success: #10b981; --danger: #ef4444;
            --border: #2a3f5f; --task-blue: #00d4ff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f1535 100%);
            color: var(--text); min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.9), rgba(26, 40, 71, 0.9));
            border-bottom: 2px solid var(--primary);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select, button {
            background: var(--bg-tertiary);
            color: var(--text);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover:not(:disabled) {
            background: var(--primary);
            color: var(--bg);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .wallet-info {
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }
        .balance-display {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
        .token-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .token-row:last-child { border-bottom: none; }
        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
        }
        .info-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .quick-buttons {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
        }
        .quick-btn:hover { border-color: var(--primary); color: var(--primary); }
        .reverse-btn {
            padding: 8px 12px;
            background: var(--accent);
            border: 1px solid var(--accent);
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
            word-break: break-all;
            font-size: 12px;
        }
        .status.success { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .status.error { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .status.loading { background: rgba(0, 212, 255, 0.1); border-color: var(--task-blue); color: var(--task-blue); }
        .task-item {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--task-blue);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item.completed {
            border-left-color: var(--success);
            opacity: 0.7;
        }
        .task-btn {
            background: var(--task-blue);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .task-btn.done {
            background: var(--success);
        }
        .nft-preview {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 3px solid var(--primary);
            border-radius: 12px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--bg-tertiary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🚀 UPBIT GIWA</div>
            <div class="header-controls">
                <select id="chainSelect" onchange="switchChain()">
                    <option value="giwa">GIWA</option>
                    <option value="arc">ARC</option>
                </select>
                <button onclick="connectWallet()"><span id="walletBtn">Connect</span></button>
            </div>
        </div>
        <div class="wallet-info" id="walletInfo" style="display: none;">
            <span id="walletAddress"></span> | <span id="chainName">GIWA</span>
        </div>
    </header>

    <main>
        <div class="tabs" id="tabs"></div>
        
        <!-- FAUCET -->
        <div id="faucet" class="tab-content active">
            <div class="card">
                <h2>💧 Faucets</h2>
                <div class="balance-display" id="faucetBalances"></div>
                <div class="input-group">
                    <select id="faucetToken" onchange="updateFaucetUI()">
                        <option value="rry">RRY - 100 tokens</option>
                        <option value="ang">ANG - 100 tokens</option>
                        <option value="knh">KNH - 100 tokens</option>
                    </select>
                </div>
                <div class="info-box">Next claim: <span id="faucetTimer">--:--:--</span></div>
                <button id="claimBtn" onclick="claimTokens()" style="width:100%; padding:15px; margin:15px 0;">Claim Tokens</button>
                <div id="faucetStatus"></div>
            </div>
        </div>
        
        <!-- SWAP -->
        <div id="swap" class="tab-content">
            <div class="card">
                <h2>⚡ Swap</h2>
                <div class="balance-display" id="swapBalances"></div>
                <div class="input-group">
                    <input type="number" id="swapAmount" placeholder="Amount" min="0" onchange="calcSwapOutput()">
                    <select id="swapTokenIn" onchange="calcSwapOutput()">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                    <button class="reverse-btn" onclick="reverseSwapTokens()">⇅</button>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setSwapPercent(25)">25%</button>
                    <button class="quick-btn" onclick="setSwapPercent(50)">50%</button>
                    <button class="quick-btn" onclick="setSwapPercent(75)">75%</button>
                    <button class="quick-btn" onclick="setSwapPercent(100)">100%</button>
                </div>
                <div class="info-box">Receive: <span id="swapOutput">0</span> <span id="swapOutToken">ANG</span> (0.25% fee)</div>
                <div class="input-group">
                    <select id="swapTokenOut">
                        <option value="ang">ANG</option>
                        <option value="rry">RRY</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <button onclick="executeSwap()" style="width:100%; padding:15px; margin:15px 0;">Swap</button>
                <div id="swapStatus"></div>
            </div>
        </div>
        
        <!-- BRIDGE -->
        <div id="bridge" class="tab-content">
            <div class="card">
                <h2>🌉 Bridge</h2>
                <div class="balance-display" id="bridgeBalances"></div>
                <div class="input-group">
                    <select id="bridgeSourceChain" onchange="updateBridgePath()">
                        <option value="giwa">From GIWA</option>
                        <option value="arc">From ARC</option>
                    </select>
                    <select id="bridgeDestChain" onchange="updateBridgePath()">
                        <option value="arc">To ARC</option>
                        <option value="giwa">To GIWA</option>
                    </select>
                    <button class="reverse-btn" onclick="reverseBridgeChains()">⇅</button>
                </div>
                <div class="info-box">Path: <span id="bridgePath">GIWA → ARC</span> | Fee: 0.50%</div>
                <div class="input-group">
                    <input type="number" id="bridgeAmount" placeholder="Amount" min="0">
                    <select id="bridgeToken">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setBridgePercent(25)">25%</button>
                    <button class="quick-btn" onclick="setBridgePercent(50)">50%</button>
                    <button class="quick-btn" onclick="setBridgePercent(75)">75%</button>
                    <button class="quick-btn" onclick="setBridgePercent(100)">100%</button>
                </div>
                <button onclick="executeBridge()" style="width:100%; padding:15px; margin:15px 0;">Bridge</button>
                <div id="bridgeStatus"></div>
            </div>
        </div>
        
        <!-- NFT -->
        <div id="nft" class="tab-content">
            <div class="card">
                <h2>🎮 Checkmate NFT</h2>
                <div class="nft-preview" style="background-image: url('https://i.ibb.co/fVHjPmxn/checkmate-pfp-1763142640689.png');"></div>
                <div class="info-box">Minted: <span id="nftSupply">0</span> / 9999</div>
                <div class="input-group">
                    <input type="text" id="nftName" placeholder="NFT Name (optional)">
                </div>
                <button onclick="mintNFT()" style="width:100%; padding:15px; margin:15px 0;">Mint NFT</button>
                <div id="nftStatus"></div>
            </div>
        </div>
        
        <!-- GM -->
        <div id="gm" class="tab-content">
            <div class="card">
                <h2>✨ GM</h2>
                <div style="font-size:48px; text-align:center; margin:20px 0; color:var(--primary);">GM ☀️</div>
                <div style="text-align:center; font-size:18px; color:var(--task-blue);">Reset: <span id="gmTimer">00:00:00</span></div>
                <div style="text-align:center; margin:20px 0;">Streak: <span id="gmStreak" style="color:var(--primary); font-size:24px;">0</span> days</div>
                <button onclick="gmCheckIn()" style="width:100%; padding:20px; margin:15px 0; font-size:18px;">Say GM! ☀️</button>
                <div id="gmStatus"></div>
            </div>
        </div>
        
        <!-- TASKS -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h2>📋 Tasks</h2>
                <div id="tasksContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== TOKEN BALANCE SYSTEM ====================
        class TokenBalance {
            constructor() {
                this.balances = {}; // { "giwa_rry": 0, "arc_ang": 100, ... }
            }

            getBalance(chain, token) {
                return this.balances[`${chain}_${token}`] || 0;
            }

            setBalance(chain, token, amount) {
                this.balances[`${chain}_${token}`] = Math.max(0, amount);
            }

            addBalance(chain, token, amount) {
                const current = this.getBalance(chain, token);
                this.setBalance(chain, token, current + amount);
            }

            subtractBalance(chain, token, amount) {
                const current = this.getBalance(chain, token);
                if (current < amount) return false;
                this.setBalance(chain, token, current - amount);
                return true;
            }

            save() {
                localStorage.setItem('tokenBalances', JSON.stringify(this.balances));
            }

            load() {
                const saved = localStorage.getItem('tokenBalances');
                this.balances = saved ? JSON.parse(saved) : {};
            }

            getChainBalances(chain) {
                return {
                    rry: this.getBalance(chain, 'rry'),
                    ang: this.getBalance(chain, 'ang'),
                    knh: this.getBalance(chain, 'knh')
                };
            }
        }

        // ==================== INITIALIZATION ====================
        const CHAINS = {
            giwa: { id: '0x1a6a9d2', name: 'GIWA' },
            arc: { id: '0x4cef52', name: 'ARC' }
        };

        const tokens = new TokenBalance();
        let currentChain = 'giwa';
        let userAddress = null;
        let gmStreak = 0;
        let lastGMDate = null;
        let faucetClaims = {};
        let completedTasks = {};

        const TABS = ['faucet', 'swap', 'bridge', 'nft', 'gm', 'tasks'];
        const TAB_LABELS = { faucet: '💧 Faucet', swap: '⚡ Swap', bridge: '🌉 Bridge', nft: '🎮 NFT', gm: '✨ GM', tasks: '📋 Tasks' };
        const TASKS_LIST = [
            { name: 'Say GM', icon: '☀️', points: 10, action: 'gm' },
            { name: 'Claim Tokens', icon: '💧', points: 20, action: 'faucet' },
            { name: 'Swap Tokens', icon: '⚡', points: 30, action: 'swap' },
            { name: 'Bridge Tokens', icon: '🌉', points: 40, action: 'bridge' },
            { name: 'Mint NFT', icon: '🎮', points: 50, action: 'nft' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            tokens.load();
            renderTabs();
            renderTasks();
            updateAllBalances();
            updateGMTimer();
            loadLocalData();
            setInterval(updateGMTimer, 1000);
            setInterval(updateFaucetUI, 1000);
        });

        function renderTabs() {
            document.getElementById('tabs').innerHTML = TABS.map(tab => 
                `<button class="tab-btn ${tab === 'faucet' ? 'active' : ''}" onclick="switchTab('${tab}')">${TAB_LABELS[tab]}</button>`
            ).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            updateAllBalances();
        }

        async function connectWallet() {
            if (!window.ethereum) return alert('Install MetaMask!');
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                document.getElementById('walletBtn').textContent = userAddress.substring(0, 6) + '...';
                document.getElementById('walletAddress').textContent = userAddress;
                document.getElementById('walletInfo').style.display = 'block';
                updateAllBalances();
            } catch (error) { alert('Connection failed'); }
        }

        async function switchChain() {
            currentChain = document.getElementById('chainSelect').value;
            document.getElementById('chainName').textContent = CHAINS[currentChain].name;
            updateAllBalances();
        }

        // ==================== BALANCE DISPLAY ====================
        function updateAllBalances() {
            const balances = tokens.getChainBalances(currentChain);
            const html = `
                <div class="token-row"><span>RRY:</span> <strong>${balances.rry}</strong></div>
                <div class="token-row"><span>ANG:</span> <strong>${balances.ang}</strong></div>
                <div class="token-row"><span>KNH:</span> <strong>${balances.knh}</strong></div>
            `;
            
            document.getElementById('faucetBalances').innerHTML = html;
            document.getElementById('swapBalances').innerHTML = html;
            document.getElementById('bridgeBalances').innerHTML = html;
        }

        // ==================== FAUCET ====================
        function updateFaucetUI() {
            const token = document.getElementById('faucetToken')?.value || 'rry';
            const key = `faucet_${token}_${currentChain}`;
            const lastClaim = faucetClaims[key] || 0;
            const now = Math.floor(Date.now() / 1000);
            const nextClaim = lastClaim + 86400;

            if (now >= nextClaim) {
                document.getElementById('faucetTimer').textContent = 'Ready!';
                document.getElementById('claimBtn').disabled = false;
            } else {
                const left = nextClaim - now;
                const h = Math.floor(left / 3600);
                const m = Math.floor((left % 3600) / 60);
                const s = left % 60;
                document.getElementById('faucetTimer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                document.getElementById('claimBtn').disabled = true;
            }
        }

        function claimTokens() {
            if (!userAddress) return showStatus('error', 'Connect wallet!', 'faucetStatus');

            const token = document.getElementById('faucetToken').value;
            const key = `faucet_${token}_${currentChain}`;
            const lastClaim = faucetClaims[key] || 0;
            const now = Math.floor(Date.now() / 1000);

            if (now < lastClaim + 86400) {
                return showStatus('error', 'Already claimed! Wait 24h', 'faucetStatus');
            }

            tokens.addBalance(currentChain, token, 100);
            faucetClaims[key] = now;
            completeTask('faucet');
            saveLocalData();
            updateFaucetUI();
            updateAllBalances();

            showStatus('success', `✅ Claimed 100 ${token.toUpperCase()}!`, 'faucetStatus');
        }

        // ==================== SWAP ====================
        function setSwapPercent(percent) {
            const balance = tokens.getBalance(currentChain, document.getElementById('swapTokenIn').value);
            document.getElementById('swapAmount').value = (balance * percent / 100).toFixed(2);
            calcSwapOutput();
        }

        function calcSwapOutput() {
            const amount = parseFloat(document.getElementById('swapAmount').value) || 0;
            const output = amount * 0.9975;
            document.getElementById('swapOutput').textContent = output.toFixed(2);
            document.getElementById('swapOutToken').textContent = document.getElementById('swapTokenOut').value.toUpperCase();
        }

        function reverseSwapTokens() {
            const tokenIn = document.getElementById('swapTokenIn').value;
            const tokenOut = document.getElementById('swapTokenOut').value;
            document.getElementById('swapTokenIn').value = tokenOut;
            document.getElementById('swapTokenOut').value = tokenIn;
            calcSwapOutput();
        }

        function executeSwap() {
            if (!userAddress) return showStatus('error', 'Connect wallet!', 'swapStatus');
            
            const amount = parseFloat(document.getElementById('swapAmount').value);
            if (!amount) return showStatus('error', 'Enter amount!', 'swapStatus');

            const tokenIn = document.getElementById('swapTokenIn').value;
            const tokenOut = document.getElementById('swapTokenOut').value;
            const balance = tokens.getBalance(currentChain, tokenIn);

            if (balance < amount) {
                return showStatus('error', `Insufficient balance! Have ${balance} ${tokenIn.toUpperCase()}`, 'swapStatus');
            }

            // Execute swap
            const fee = amount * 0.0025;
            const sendAmount = amount - fee;

            tokens.subtractBalance(currentChain, tokenIn, amount);
            tokens.addBalance(currentChain, tokenOut, sendAmount);

            completeTask('swap');
            tokens.save();
            saveLocalData();
            updateAllBalances();

            showStatus('success', `✅ Swapped ${amount} ${tokenIn.toUpperCase()} → ${sendAmount.toFixed(2)} ${tokenOut.toUpperCase()}!`, 'swapStatus');
            document.getElementById('swapAmount').value = '';
            calcSwapOutput();
        }

        // ==================== BRIDGE ====================
        function updateBridgePath() {
            const source = document.getElementById('bridgeSourceChain').value;
            const dest = document.getElementById('bridgeDestChain').value;
            document.getElementById('bridgePath').textContent = `${source.toUpperCase()} → ${dest.toUpperCase()}`;
        }

        function reverseBridgeChains() {
            const source = document.getElementById('bridgeSourceChain').value;
            const dest = document.getElementById('bridgeDestChain').value;
            document.getElementById('bridgeSourceChain').value = dest;
            document.getElementById('bridgeDestChain').value = source;
            updateBridgePath();
        }

        function setBridgePercent(percent) {
            const balance = tokens.getBalance(currentChain, document.getElementById('bridgeToken').value);
            document.getElementById('bridgeAmount').value = (balance * percent / 100).toFixed(2);
        }

        function executeBridge() {
            if (!userAddress) return showStatus('error', 'Connect wallet!', 'bridgeStatus');
            
            const amount = parseFloat(document.getElementById('bridgeAmount').value);
            if (!amount) return showStatus('error', 'Enter amount!', 'bridgeStatus');

            const sourceChain = document.getElementById('bridgeSourceChain').value;
            const destChain = document.getElementById('bridgeDestChain').value;
            const token = document.getElementById('bridgeToken').value;
            const balance = tokens.getBalance(sourceChain, token);

            if (balance < amount) {
                return showStatus('error', `Insufficient balance on ${sourceChain.toUpperCase()}! Have ${balance}`, 'bridgeStatus');
            }

            // Execute bridge
            const fee = amount * 0.005;
            const sendAmount = amount - fee;

            tokens.subtractBalance(sourceChain, token, amount);
            tokens.addBalance(destChain, token, sendAmount);

            completeTask('bridge');
            tokens.save();
            saveLocalData();
            updateAllBalances();

            showStatus('success', `✅ Bridged ${amount} ${token.toUpperCase()} ${sourceChain.toUpperCase()} → ${destChain.toUpperCase()}! Received ${sendAmount.toFixed(2)}`, 'bridgeStatus');
            document.getElementById('bridgeAmount').value = '';
        }

        // ==================== NFT ====================
        function mintNFT() {
            if (!userAddress) return showStatus('error', 'Connect wallet!', 'nftStatus');

            const name = document.getElementById('nftName').value || 'Checkmate #' + Math.floor(Math.random() * 9999);
            completeTask('nft');
            saveLocalData();

            showStatus('success', `✅ Minted "${name}"!`, 'nftStatus');
            document.getElementById('nftName').value = '';
        }

        // ==================== GM ====================
        function gmCheckIn() {
            const today = new Date().toDateString();
            if (lastGMDate === today) return showStatus('error', 'Already checked in!', 'gmStatus');

            lastGMDate = today;
            gmStreak++;
            document.getElementById('gmStreak').textContent = gmStreak;
            completeTask('gm');
            saveLocalData();
            showStatus('success', `✨ GM! Streak: ${gmStreak}`, 'gmStatus');
        }

        function updateGMTimer() {
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 86400000);
            tomorrow.setHours(0, 0, 0, 0);
            const diff = tomorrow - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('gmTimer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ==================== TASKS ====================
        function renderTasks() {
            document.getElementById('tasksContainer').innerHTML = TASKS_LIST.map(task => {
                const today = new Date().toDateString();
                const key = `${task.action}_${today}`;
                const done = completedTasks[key];
                return `
                    <div class="task-item ${done ? 'completed' : ''}">
                        <div><span style="font-size:24px; margin-right:10px;">${task.icon}</span>${task.name} <span style="color:var(--task-blue); margin-left:10px;">+${task.points}pts</span></div>
                        <button class="task-btn ${done ? 'done' : ''}" ${done ? 'disabled' : ''}>${done ? '✓ Done' : 'Complete'}</button>
                    </div>
                `;
            }).join('');
        }

        function completeTask(action) {
            const today = new Date().toDateString();
            completedTasks[`${action}_${today}`] = true;
            renderTasks();
        }

        // ==================== UTILS ====================
        function showStatus(type, msg, id) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            document.getElementById(id).innerHTML = '';
            document.getElementById(id).appendChild(div);
            if (type !== 'loading') setTimeout(() => div.remove(), 8000);
        }

        function saveLocalData() {
            localStorage.setItem('gmStreak', gmStreak);
            localStorage.setItem('lastGMDate', lastGMDate);
            localStorage.setItem('faucetClaims', JSON.stringify(faucetClaims));
            localStorage.setItem('completedTasks', JSON.stringify(completedTasks));
        }

        function loadLocalData() {
            gmStreak = parseInt(localStorage.getItem('gmStreak')) || 0;
            lastGMDate = localStorage.getItem('lastGMDate');
            faucetClaims = JSON.parse(localStorage.getItem('faucetClaims')) || {};
            completedTasks = JSON.parse(localStorage.getItem('completedTasks')) || {};
            document.getElementById('gmStreak').textContent = gmStreak;
            renderTasks();
        }
    </script>
</body>
</html>
