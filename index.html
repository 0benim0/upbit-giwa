<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT GIWA - Real DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #d4af37;
            --primary-dark: #b8860b;
            --bg: #0a0e27;
            --bg-secondary: #141b3a;
            --bg-tertiary: #1a2847;
            --text: #e8e8e8;
            --text-muted: #a0a0a0;
            --accent: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --border: #2a3f5f;
            --task-blue: #00d4ff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f1535 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.9), rgba(26, 40, 71, 0.9));
            border-bottom: 2px solid var(--primary);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select, button {
            background: var(--bg-tertiary);
            color: var(--text);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        button:hover:not(:disabled) {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.3);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .wallet-info {
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 22px;
        }
        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
            word-break: break-all;
            font-size: 12px;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }
        .status.info {
            background: rgba(124, 58, 237, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }
        .status.loading {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--task-blue);
            color: var(--task-blue);
        }
        .tx-link {
            color: var(--task-blue);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }
        .tx-link:hover {
            color: var(--primary);
        }
        .nft-preview {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 12px;
            border: 3px solid var(--primary);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--bg-tertiary);
        }
        .task-item {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--task-blue);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-btn {
            background: var(--task-blue);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .task-btn:hover { opacity: 0.8; }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; }
            select, button { width: 100%; }
            input { min-width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🚀 UPBIT GIWA</div>
            <div class="header-controls">
                <select id="chainSelect" onchange="switchChain()">
                    <option value="giwa">GIWA Testnet</option>
                    <option value="arc">ARC Testnet</option>
                </select>
                <button onclick="connectWallet()"><span id="walletBtn">Connect Wallet</span></button>
            </div>
        </div>
        <div class="wallet-info" id="walletInfo" style="display: none;">
            Wallet: <span id="walletAddress"></span> | Chain: <span id="chainName">GIWA</span>
        </div>
    </header>

    <main>
        <div class="tabs" id="tabs"></div>
        
        <!-- FAUCET TAB -->
        <div id="faucet" class="tab-content active">
            <div class="card">
                <h2>💧 Token Faucets</h2>
                <p>Claim 100 tokens per day (max 1 per user per 24h)</p>
                <div class="input-group">
                    <select id="faucetToken">
                        <option value="rry">RurouniYu (RRY)</option>
                        <option value="ang">AnichessGame (ANG)</option>
                        <option value="knh">Kenshin (KNH)</option>
                    </select>
                </div>
                <button onclick="claimTokens()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">
                    Claim 100 Tokens 💧
                </button>
                <div id="faucetStatus"></div>
            </div>
        </div>
        
        <!-- SWAP TAB -->
        <div id="swap" class="tab-content">
            <div class="card">
                <h2>⚡ Swap Tokens</h2>
                <div class="input-group">
                    <input type="number" id="swapAmount" placeholder="Amount" min="0">
                    <select id="swapTokenIn">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <div style="text-align: center; margin: 20px 0; font-size: 24px; color: var(--primary);">⇅</div>
                <div class="input-group">
                    <select id="swapTokenOut">
                        <option value="ang">ANG</option>
                        <option value="rry">RRY</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <button onclick="executeSwap()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">Execute Swap</button>
                <div id="swapStatus"></div>
            </div>
        </div>
        
        <!-- BRIDGE TAB -->
        <div id="bridge" class="tab-content">
            <div class="card">
                <h2>🌉 Bridge Tokens</h2>
                <div class="input-group">
                    <input type="number" id="bridgeAmount" placeholder="Amount" min="0">
                </div>
                <div class="input-group">
                    <select id="bridgeToken">
                        <option value="rry">RRY</option>
                        <option value="ang">ANG</option>
                        <option value="knh">KNH</option>
                    </select>
                </div>
                <button onclick="executeBridge()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">Bridge Token</button>
                <div id="bridgeStatus"></div>
            </div>
        </div>
        
        <!-- NFT TAB -->
        <div id="nft" class="tab-content">
            <div class="card">
                <h2>🎮 Mint Checkmate NFT</h2>
                <div class="nft-preview" style="background-image: url('https://i.ibb.co/fVHjPmxn/checkmate-pfp-1763142640689.png');"></div>
                <div class="input-group">
                    <input type="text" id="nftName" placeholder="NFT Name (optional)">
                </div>
                <button onclick="mintNFT()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">Mint NFT</button>
                <div id="nftStatus"></div>
            </div>
        </div>
        
        <!-- GM TAB -->
        <div id="gm" class="tab-content">
            <div class="card">
                <h2>✨ Daily GM</h2>
                <div style="font-size: 48px; text-align: center; margin: 20px 0; color: var(--primary);">GM ☀️</div>
                <div style="text-align: center; font-size: 18px; color: var(--task-blue); margin: 15px 0;">
                    Next Reset: <span id="gmTimer">00:00:00</span>
                </div>
                <div style="text-align: center; margin: 20px 0;">
                    Streak: <span id="gmStreak" style="color: var(--primary); font-size: 24px;">0</span> days
                </div>
                <button onclick="gmCheckIn()" style="width: 100%; padding: 20px; margin: 15px 0; font-size: 18px;">Say GM! ☀️</button>
                <div id="gmStatus"></div>
            </div>
        </div>
        
        <!-- TASKS TAB -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h2>📋 Daily Tasks</h2>
                <div id="tasksContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONTRACTS CONFIG ====================
        const CHAINS = {
            giwa: {
                id: '0x1a6a9d2',
                name: 'GIWA',
                rpc: 'https://rpc.testnet.chain.giwa.io'
            },
            arc: {
                id: '0x4cef52',
                name: 'ARC',
                rpc: 'https://arc-testnet.drpc.org'
            }
        };

        const CONTRACTS = {
            giwa: {
                faucetRry: '0x9ee860D517E1107ADfD5a4ba8ED4c44770F196F8',
                faucetAng: '0x290d07b026fb39302Bf47d7bfACcFF3b2dAAf3eD',
                faucetKnh: '0xA90f50c80B5899Fcb0A99595031bb4D2f08A65CB',
                rry: '0x2Ab6E0364593C59018C49130602B4fBBEE77eEBd',
                ang: '0x5d28Df1Fd08981347caF44C4f94C8B57458d1e85',
                knh: '0xFb6dcAdd47176dab6E24bB93fc3B61bF3FFbfB00',
                swap: '0x571B477afB798B9806EA1094b706210899E1665e',
                nft: '0x3422A8c40bADe21DB15FfB73a839aE25DC5A3f71'
            },
            arc: {
                faucetRry: '0xA3D3C681Cb511d05337cEAfB5934551746b7ec51',
                faucetAng: '0x10b7049da0691f294D742a3A457Ea6F137dBABD1',
                faucetKnh: '0xe097481fFC700a05B22d653E7aE4Bc022dFCe9ab',
                rry: '0x998686e27444Ec1b4700299f2222A9Dd27eC9eeA',
                ang: '0x25832a57D698C9072C71aA735Be2D11A48e9a1A6',
                knh: '0x2121C6c9EEfEA700831b16Ba5791a145599fb54B',
                swap: '0xFcfe1D1BF3083ACf627d04c2Ca0cE0B43335fC2e',
                nft: '0x924b73c5fdA620b5B0f9B6c51b6BE9162d1b8EED'
            }
        };

        const FAUCET_ABI = [
            'function claimTokens() public',
            'function timeUntilNextClaim(address user) public view returns (uint256)',
            'function getUserStats(address user) public view returns (uint256 claimed, uint256 timeLeft)'
        ];

        const SWAP_ABI = [
            'function swapTokens(address tokenIn, uint256 amountIn, address tokenOut) public returns (uint256)',
            'function estimateSwapOutput(uint256 amountIn) public view returns (uint256)'
        ];

        // ==================== STATE ====================
        let currentChain = 'giwa';
        let userAddress = null;
        let provider = null;
        let signer = null;
        let gmStreak = 0;
        let lastGMDate = null;

        const TABS = ['faucet', 'swap', 'bridge', 'nft', 'gm', 'tasks'];
        const TAB_LABELS = {
            'faucet': '💧 Faucet',
            'swap': '⚡ Swap',
            'bridge': '🌉 Bridge',
            'nft': '🎮 NFT',
            'gm': '✨ GM',
            'tasks': '📋 Tasks'
        };

        const TASKS_LIST = [
            { name: 'Say GM', icon: '☀️', points: 10 },
            { name: 'Claim Tokens', icon: '💧', points: 20 },
            { name: 'Swap Tokens', icon: '⚡', points: 30 },
            { name: 'Bridge Tokens', icon: '🌉', points: 40 },
            { name: 'Mint NFT', icon: '🎮', points: 50 }
        ];

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTasks();
            updateGMTimer();
            loadLocalData();
            setInterval(updateGMTimer, 1000);
        });

        function renderTabs() {
            document.getElementById('tabs').innerHTML = TABS.map(tab => 
                `<button class="tab-btn ${tab === 'faucet' ? 'active' : ''}" onclick="switchTab('${tab}')">${TAB_LABELS[tab]}</button>`
            ).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // ==================== WALLET ====================
        async function connectWallet() {
            if (!window.ethereum) return showStatus('error', 'MetaMask not installed!', 'faucetStatus');
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                
                document.getElementById('walletBtn').textContent = userAddress.substring(0, 6) + '...' + userAddress.substring(38);
                document.getElementById('walletAddress').textContent = userAddress;
                document.getElementById('walletInfo').style.display = 'block';
                
                showStatus('success', '✅ Wallet connected!', 'faucetStatus');
            } catch (error) {
                showStatus('error', 'Connection failed: ' + error.message, 'faucetStatus');
            }
        }

        async function switchChain() {
            currentChain = document.getElementById('chainSelect').value;
            document.getElementById('chainName').textContent = CHAINS[currentChain].name;
            
            if (userAddress && window.ethereum) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: CHAINS[currentChain].id }]
                    });
                    showStatus('info', `Switched to ${CHAINS[currentChain].name}`, 'faucetStatus');
                } catch (error) {
                    console.log('Chain switch error:', error);
                }
            }
        }

        // ==================== FAUCET ====================
        async function claimTokens() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!', 'faucetStatus');
            if (!signer) return showStatus('error', 'Signer not ready!', 'faucetStatus');

            const tokenType = document.getElementById('faucetToken').value;
            const contracts = CONTRACTS[currentChain];
            let faucetAddress;

            if (tokenType === 'rry') faucetAddress = contracts.faucetRry;
            else if (tokenType === 'ang') faucetAddress = contracts.faucetAng;
            else faucetAddress = contracts.faucetKnh;

            try {
                showStatus('loading', '⏳ Processing claim...', 'faucetStatus');

                const faucet = new ethers.Contract(faucetAddress, FAUCET_ABI, signer);
                const tx = await faucet.claimTokens();
                
                showStatus('loading', '⏳ Waiting for confirmation...', 'faucetStatus');
                const receipt = await tx.wait();

                showStatus('success', `✅ Claimed 100 ${tokenType.toUpperCase()}! TX: <span class="tx-link" onclick="window.open('https://explorer.chain.giwa.io/tx/${tx.hash}')">${tx.hash.substring(0, 10)}...</span>`, 'faucetStatus');
            } catch (error) {
                showStatus('error', 'Claim failed: ' + error.message, 'faucetStatus');
            }
        }

        // ==================== SWAP ====================
        async function executeSwap() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!', 'swapStatus');
            if (!signer) return showStatus('error', 'Signer not ready!', 'swapStatus');

            const amount = parseFloat(document.getElementById('swapAmount').value);
            if (!amount || amount <= 0) return showStatus('error', 'Enter valid amount!', 'swapStatus');

            try {
                showStatus('loading', '⏳ Processing swap...', 'swapStatus');
                const swapAddress = CONTRACTS[currentChain].swap;
                const swap = new ethers.Contract(swapAddress, SWAP_ABI, signer);
                
                const amountWei = ethers.parseEther(amount.toString());
                const tx = await swap.swapTokens(
                    CONTRACTS[currentChain].rry,
                    amountWei,
                    CONTRACTS[currentChain].ang
                );

                showStatus('loading', '⏳ Waiting for confirmation...', 'swapStatus');
                await tx.wait();

                showStatus('success', `✅ Swapped ${amount} tokens! TX: <span class="tx-link" onclick="window.open('https://explorer.chain.giwa.io/tx/${tx.hash}')">${tx.hash.substring(0, 10)}...</span>`, 'swapStatus');
                document.getElementById('swapAmount').value = '';
            } catch (error) {
                showStatus('error', 'Swap failed: ' + error.message, 'swapStatus');
            }
        }

        // ==================== BRIDGE ====================
        async function executeBridge() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!', 'bridgeStatus');
            if (!signer) return showStatus('error', 'Signer not ready!', 'bridgeStatus');

            const amount = parseFloat(document.getElementById('bridgeAmount').value);
            if (!amount || amount <= 0) return showStatus('error', 'Enter valid amount!', 'bridgeStatus');

            try {
                showStatus('loading', '⏳ Initiating bridge...', 'bridgeStatus');
                const swapAddress = CONTRACTS[currentChain].swap;
                const swap = new ethers.Contract(swapAddress, SWAP_ABI, signer);
                
                const amountWei = ethers.parseEther(amount.toString());
                const sourceChain = currentChain === 'giwa' ? 'GIWA' : 'ARC';
                const destChain = currentChain === 'giwa' ? 'ARC' : 'GIWA';

                const tx = await swap.startBridge(
                    CONTRACTS[currentChain].rry,
                    amountWei,
                    sourceChain,
                    destChain
                );

                showStatus('loading', '⏳ Waiting for confirmation...', 'bridgeStatus');
                await tx.wait();

                showStatus('success', `✅ Bridge initiated! TX: <span class="tx-link" onclick="window.open('https://explorer.chain.giwa.io/tx/${tx.hash}')">${tx.hash.substring(0, 10)}...</span>`, 'bridgeStatus');
                document.getElementById('bridgeAmount').value = '';
            } catch (error) {
                showStatus('error', 'Bridge failed: ' + error.message, 'bridgeStatus');
            }
        }

        // ==================== NFT ====================
        async function mintNFT() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!', 'nftStatus');
            if (!signer) return showStatus('error', 'Signer not ready!', 'nftStatus');

            try {
                showStatus('loading', '⏳ Minting NFT...', 'nftStatus');
                const nftName = document.getElementById('nftName').value || 'Checkmate #' + Math.floor(Math.random() * 9999);
                
                // Simulated NFT mint (echte Implementierung würde ERC721 Contract brauchen)
                showStatus('success', `✅ NFT "${nftName}" minted! (Simulation - braucht ERC721 Integration)`, 'nftStatus');
                document.getElementById('nftName').value = '';
            } catch (error) {
                showStatus('error', 'Mint failed: ' + error.message, 'nftStatus');
            }
        }

        // ==================== GM ====================
        function gmCheckIn() {
            const today = new Date().toDateString();
            if (lastGMDate === today) {
                return showStatus('error', 'Already checked in today!', 'gmStatus');
            }

            lastGMDate = today;
            gmStreak++;
            document.getElementById('gmStreak').textContent = gmStreak;
            showStatus('success', `✨ GM! Streak: ${gmStreak} days`, 'gmStatus');
            saveLocalData();
        }

        function updateGMTimer() {
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            tomorrow.setHours(0, 0, 0, 0);
            
            const diff = tomorrow - now;
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);
            
            document.getElementById('gmTimer').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ==================== TASKS ====================
        function renderTasks() {
            document.getElementById('tasksContainer').innerHTML = TASKS_LIST.map((task, idx) => `
                <div class="task-item">
                    <div>
                        <span style="font-size: 24px; margin-right: 10px;">${task.icon}</span>
                        <span>${task.name}</span>
                        <span style="color: var(--task-blue); margin-left: 10px;">+${task.points}pts</span>
                    </div>
                    <button class="task-btn" onclick="completeTask(${idx})">Complete</button>
                </div>
            `).join('');
        }

        function completeTask(idx) {
            showStatus('success', `✅ Task completed! +${TASKS_LIST[idx].points}pts`, 'tasksContainer');
        }

        // ==================== UTILS ====================
        function showStatus(type, message, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            container.innerHTML = '';
            container.appendChild(div);

            if (type !== 'loading') {
                setTimeout(() => div.remove(), 8000);
            }
        }

        function saveLocalData() {
            localStorage.setItem('gmStreak', gmStreak);
            localStorage.setItem('lastGMDate', lastGMDate);
        }
