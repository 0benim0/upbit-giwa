<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT GIWA - Complete DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --primary-dark: #b8860b;
            --bg: #0a0e27;
            --bg-secondary: #141b3a;
            --bg-tertiary: #1a2847;
            --text: #e8e8e8;
            --text-muted: #a0a0a0;
            --accent: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --border: #2a3f5f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f1535 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.9), rgba(26, 40, 71, 0.9));
            border-bottom: 2px solid var(--primary);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, button {
            background: var(--bg-tertiary);
            color: var(--text);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        button:hover {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.3);
        }

        select:hover {
            border-color: var(--primary);
            background: var(--bg-secondary);
        }

        .wallet-info {
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        .tab-btn:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 22px;
        }

        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .swap-section {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid var(--border);
        }

        .swap-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .swap-box {
            flex: 1;
            min-width: 200px;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        .swap-box label {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .quick-amounts {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .slippage-control {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px solid var(--border);
        }

        .slippage-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .slippage-btn {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .slippage-btn.active {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-box:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }

        .status.info {
            background: rgba(124, 58, 237, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
            }

            select, button {
                width: 100%;
            }

            .tabs {
                flex-direction: column;
            }

            .swap-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🚀 UPBIT GIWA</div>
            <div class="header-controls">
                <select id="chainSelect" onchange="switchChain()">
                    <option value="giwa">GIWA Testnet</option>
                    <option value="arc">ARC Testnet</option>
                    <option value="sepolia">Ethereum Sepolia</option>
                    <option value="base-sepolia">Base Sepolia</option>
                </select>
                <button onclick="connectWallet()">
                    <span id="walletBtn">Connect Wallet</span>
                </button>
            </div>
        </div>
        <div class="wallet-info" id="walletInfo" style="display: none;">
            Wallet: <span id="walletAddress"></span> | Chain: <span id="chainName">GIWA</span>
        </div>
    </header>

    <main>
        <div class="tabs" id="tabs"></div>
        
        <!-- TAB CONTENT -->
        
        <!-- SWAP TAB -->
        <div id="swap" class="tab-content">
            <div class="card">
                <h2>⚡ Swap Tokens</h2>
                <p>Swap your tokens with minimal slippage</p>
                
                <div class="swap-section">
                    <div class="swap-box">
                        <label>You Send</label>
                        <input type="number" id="swapAmountIn" placeholder="0" onchange="updateSwapOutput()">
                        <select id="swapTokenIn" onchange="updateSwapOutput()">
                            <option value="token1">Token A</option>
                            <option value="token2">Token B</option>
                            <option value="usdc">USDC</option>
                        </select>
                        <div class="quick-amounts">
                            <button class="quick-btn" onclick="setQuickAmount(25)">25%</button>
                            <button class="quick-btn" onclick="setQuickAmount(50)">50%</button>
                            <button class="quick-btn" onclick="setQuickAmount(75)">75%</button>
                            <button class="quick-btn" onclick="setQuickAmount(100)">MAX</button>
                        </div>
                    </div>
                    
                    <div style="text-align: center; font-size: 24px; color: var(--primary);">⇅</div>
                    
                    <div class="swap-box">
                        <label>You Receive</label>
                        <input type="number" id="swapAmountOut" placeholder="0" readonly>
                        <select id="swapTokenOut" onchange="updateSwapOutput()">
                            <option value="token2">Token B</option>
                            <option value="token1">Token A</option>
                            <option value="usdc">USDC</option>
                        </select>
                    </div>
                </div>
                
                <div class="slippage-control">
                    <label>Slippage Tolerance</label>
                    <input type="number" id="slippageAmount" value="0.5" min="0" max="5" step="0.1">%
                    <div class="slippage-options">
                        <button class="slippage-btn" onclick="setSlippage(0.1)">0.1%</button>
                        <button class="slippage-btn active" onclick="setSlippage(0.5)">0.5%</button>
                        <button class="slippage-btn" onclick="setSlippage(1)">1%</button>
                        <button class="slippage-btn" onclick="setSlippage(5)">5%</button>
                    </div>
                </div>
                
                <div style="background: var(--bg-tertiary); padding: 15px; border-radius: 8px; margin: 15px 0;">
                    <div style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px;">
                        <span>Price:</span>
                        <span id="swapPrice">1 = 0.99</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px;">
                        <span>Fee:</span>
                        <span id="swapFee">0.25%</span>
                    </div>
                </div>
                
                <button onclick="executeSwap()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">
                    Swap Tokens
                </button>
                <div id="swapStatus"></div>
            </div>
        </div>
        
        <!-- BRIDGE TAB -->
        <div id="bridge" class="tab-content">
            <div class="card">
                <h2>🌉 Bridge Tokens</h2>
                <p>Transfer tokens across chains</p>
                
                <div class="input-group">
                    <select id="bridgeSourceChain">
                        <option value="giwa">From GIWA Testnet</option>
                        <option value="arc">From ARC Testnet</option>
                        <option value="sepolia">From Ethereum Sepolia</option>
                        <option value="base-sepolia">From Base Sepolia</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <select id="bridgeDestChain">
                        <option value="arc">To ARC Testnet</option>
                        <option value="giwa">To GIWA Testnet</option>
                        <option value="sepolia">To Ethereum Sepolia</option>
                        <option value="base-sepolia">To Base Sepolia</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <input type="number" id="bridgeAmount" placeholder="Amount to bridge" min="0">
                    <select id="bridgeToken">
                        <option value="usdc">USDC</option>
                        <option value="eth">ETH</option>
                        <option value="dai">DAI</option>
                    </select>
                </div>
                
                <div style="background: var(--bg-tertiary); padding: 15px; border-radius: 8px; margin: 15px 0;">
                    <div style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px;">
                        <span>Amount to Receive:</span>
                        <span id="bridgeReceiveAmount">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px;">
                        <span>Bridge Fee:</span>
                        <span id="bridgeFeeDisplay">0.50%</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; color: var(--text-muted);">
                        <span>Estimated Time:</span>
                        <span>2-5 minutes</span>
                    </div>
                </div>
                
                <button onclick="executeBridge()" style="width: 100%; padding: 15px; margin: 15px 0; font-size: 16px;">
                    Bridge Tokens
                </button>
                <div id="bridgeStatus"></div>
            </div>
        </div>
        
        <!-- NFT MINTING TAB -->
        <div id="nft-mining" class="tab-content">
            <div class="card">
                <h2>🎮 NFT Minting</h2>
                <div class="input-group">
                    <input type="text" id="nftName" placeholder="NFT Name">
                    <button onclick="mintNFT()">Mint NFT</button>
                </div>
                <div id="nftStatus"></div>
            </div>
        </div>
        
        <!-- GM CHECK-IN TAB -->
        <div id="gm-checkin" class="tab-content">
            <div class="card">
                <h2>✨ Daily GM</h2>
                <button onclick="gmCheckIn()" style="width: 100%; padding: 20px; font-size: 18px; margin: 20px 0;">
                    Say GM!
                </button>
                <div id="gmStatus"></div>
            </div>
        </div>
        
        <!-- PROFILE TAB -->
        <div id="profil" class="tab-content">
            <div class="card">
                <h2>👤 Profile & Stats</h2>
                <button onclick="loadUserStats()">Load Stats</button>
                <div class="stats-grid" id="statsContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIG ====================
        const CHAINS = {
            giwa: {
                name: 'GIWA Testnet',
                chainId: '0x1a6a9d2',
                rpc: 'https://rpc.testnet.chain.giwa.io',
                contracts: { swap: '0x...', bridge: '0x...', nft: '0x3422A8c40bADe21DB15FfB73a839aE25DC5A3f71' }
            },
            arc: {
                name: 'ARC Testnet',
                chainId: '0x4cef52',
                rpc: 'https://arc-testnet.drpc.org',
                contracts: { swap: '0x...', bridge: '0x...', nft: '0x924b73c5fdA620b5B0f9B6c51b6BE9162d1b8EED' }
            },
            sepolia: {
                name: 'Ethereum Sepolia',
                chainId: '0xaa36a7',
                rpc: 'https://sepolia.infura.io/v3/YOUR_INFURA_KEY',
                usdc: '0xf08a50178dfcde18524640ea6618a1f965821715'
            },
            'base-sepolia': {
                name: 'Base Sepolia',
                chainId: '0x14a34',
                rpc: 'https://sepolia.base.org',
                usdc: '0x036cbd53842c5426634e7929541ec2318f3dcf7e'
            }
        };

        // ==================== STATE ====================
        let currentChain = 'giwa';
        let provider = null;
        let signer = null;
        let userAddress = null;
        let slippage = 0.5;

        const TABS = ['swap', 'bridge', 'nft-mining', 'gm-checkin', 'profil'];
        const TAB_LABELS = {
            'swap': '⚡ Swap',
            'bridge': '🌉 Bridge',
            'nft-mining': '🎮 NFT',
            'gm-checkin': '✨ GM',
            'profil': '👤 Profile'
        };

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            checkWallet();
        });

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = TABS.map(tab => `
                <button class="tab-btn ${tab === 'swap' ? 'active' : ''}" 
                    onclick="switchTab('${tab}')">
                    ${TAB_LABELS[tab]}
                </button>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ==================== WALLET ====================
        async function connectWallet() {
            if (!window.ethereum) {
                alert('Please install MetaMask!');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                updateWalletUI();
                await switchChain();
            } catch (error) {
                showStatus('error', 'Wallet connection failed');
            }
        }

        async function switchChain() {
            if (!userAddress) return;
            currentChain = document.getElementById('chainSelect').value;
            const chain = CHAINS[currentChain];
            
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: chain.chainId }],
                });
            } catch (error) {
                console.log('Chain switch info:', error);
            }

            document.getElementById('chainName').textContent = chain.name;
        }

        async function checkWallet() {
            if (window.ethereum?.selectedAddress) {
                userAddress = window.ethereum.selectedAddress;
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                updateWalletUI();
                await switchChain();
            }
        }

        function updateWalletUI() {
            const btn = document.getElementById('walletBtn');
            const info = document.getElementById('walletInfo');
            const addr = document.getElementById('walletAddress');
            
            btn.textContent = userAddress.substring(0, 6) + '...' + userAddress.substring(38);
            addr.textContent = userAddress;
            info.style.display = 'block';
        }

        // ==================== SWAP ====================
        function setQuickAmount(percent) {
            const balance = 1000; // Mock balance
            const amount = (balance * percent) / 100;
            document.getElementById('swapAmountIn').value = amount.toFixed(2);
            updateSwapOutput();
        }

        function setSlippage(value) {
            slippage = value;
            document.getElementById('slippageAmount').value = value;
            document.querySelectorAll('.slippage-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateSwapOutput();
        }

        function updateSwapOutput() {
            const amountIn = parseFloat(document.getElementById('swapAmountIn').value) || 0;
            const fee = amountIn * 0.0025; // 0.25% fee
            const amountOut = amountIn - fee;
            document.getElementById('swapAmountOut').value = amountOut.toFixed(6);
            document.getElementById('swapPrice').textContent = `1 = ${(amountOut / amountIn).toFixed(4)}`;
        }

        async function executeSwap() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!');
            
            const amountIn = parseFloat(document.getElementById('swapAmountIn').value);
            if (!amountIn) return showStatus('error', 'Enter amount!');
            
            showStatus('info', 'Processing swap...');
            setTimeout(() => {
                showStatus('success', `✅ Swapped ${amountIn.toFixed(2)} tokens successfully!`);
                document.getElementById('swapAmountIn').value = '';
                updateSwapOutput();
            }, 1500);
        }

        // ==================== BRIDGE ====================
        function executeBridge() {
            if (!userAddress) return showStatus('error', 'Connect wallet first!');
            
            const amount = parseFloat(document.getElementById('bridgeAmount').value);
            if (!amount) return showStatus('error', 'Enter amount!');
            
            const source = document.getElementById('bridgeSourceChain').value;
            const dest = document.getElementById('bridgeDestChain').value;
            
            if (source === dest) return showStatus('error', 'Select different chains!');
            
            showStatus('info', `Bridging ${amount} tokens from ${CHAINS[source].name} to ${CHAINS[dest].name}...`);
            setTimeout(() => {
                showStatus('success', `✅ Bridge initiated! Transaction ID: ${Math.random().toString(36).substr(2, 9)}`);
                document.getElementById('bridgeAmount').value = '';
            }, 2000);
        }

        // ==================== STATUS ====================
        function showStatus(type, message) {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            
            let container = document.querySelector('main');
            if (event?.target?.parentElement) {
                container = event.target.parentElement;
            }
            
            container.appendChild(statusDiv);
            setTimeout(() => statusDiv.remove(), 5000);
        }

        // ==================== MOCK FUNCTIONS ====================
        function mintNFT() {
            showStatus('success', '🎉 NFT minted successfully!');
        }

        function gmCheckIn() {
            showStatus('success', '✨ GM Check-in successful!');
        }

        function loadUserStats() {
            const stats = document.getElementById('statsContainer');
            stats.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">Total TX</div>
                    <div class="stat-value">42</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Tokens Swapped</div>
                    <div class="stat-value">1,250</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Bridges Used</div>
                    <div class="stat-value">8</div>
                </div>
            `;
        }
    </script>
</body>
</html>
