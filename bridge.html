<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge - UPBIT DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00d4ff; --bg: #0a0e27; --bg-secondary: #141b3a;
            --bg-tertiary: #1a2847; --text: #e8e8e8; --text-muted: #a0a0a0;
            --success: #10b981; --danger: #ef4444; --border: #2a3f5f;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f1535 100%);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, rgba(20, 27, 58, 0.9), rgba(26, 40, 71, 0.9));
            border-bottom: 2px solid var(--primary);
            padding: 20px;
        }
        .header-content {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        main {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }
        button {
            padding: 10px 15px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-connect {
            background: var(--success);
            border-color: var(--success);
            color: white;
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
        }
        .btn-connect:hover {
            background: rgba(16, 185, 129, 0.8);
        }
        .btn-back {
            background: #555;
            border-color: #555;
            color: white;
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background: #777;
        }
        .btn-action {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg);
            width: 100%;
            padding: 15px;
            font-size: 16px;
            margin: 15px 0;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        .card {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }
        .wallet-status {
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .wallet-status-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .wallet-address {
            font-size: 14px;
            color: var(--success);
            font-weight: bold;
            font-family: monospace;
            word-break: break-all;
        }
        .info-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 13px;
        }
        .token-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .token-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .token-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }
        .token-btn:hover {
            border-color: var(--primary);
        }
        .balance-box {
            background: var(--bg-tertiary);
            border: 2px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-label {
            color: var(--text-muted);
        }
        .balance-amount {
            color: var(--primary);
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--primary);
            color: var(--text);
            border-radius: 8px;
            font-size: 16px;
            margin: 12px 0;
        }
        .chains {
            background: var(--bg-tertiary);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px solid var(--border);
        }
        .chain-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .chain-row select {
            flex: 1;
            padding: 8px;
            background: var(--bg-secondary);
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .fees {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .fee-btn {
            padding: 8px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .fee-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }
        .summary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 13px;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 13px;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .status.loading {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🌉 Bridge</div>
        </div>
    </header>

    <main>
        <a href="/index.html"><button class="btn-back">← Zurück zur Hauptseite</button></a>

        <div class="wallet-status">
            <div class="wallet-status-text">Wallet Status</div>
            <div class="wallet-address" id="walletAddress">Not Connected</div>
        </div>

        <button class="btn-connect" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

        <div class="card">
            <h2>🌉 Bridge to Other Chains</h2>

            <!-- Token Selection -->
            <div class="info-box"><strong>Select Token:</strong></div>
            <div class="token-buttons">
                <button class="token-btn active" onclick="selectToken('usdc', this)">💵 USDC</button>
                <button class="token-btn" onclick="selectToken('eurc', this)">🪙 EURC</button>
            </div>

            <!-- Balance Display -->
            <div class="balance-box">
                <span class="balance-label" id="balanceLabel">💵 USDC Balance:</span>
                <span class="balance-amount" id="balanceAmount">0.0000</span>
            </div>

            <!-- Chains -->
            <div class="chains">
                <div class="chain-row">
                    <div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">FROM</div>
                        <select id="fromChain" onchange="updateChains()">
                            <option value="arc">🔵 ARC</option>
                            <option value="ink">⚪ INK</option>
                            <option value="giwa">🟣 GIWA</option>
                        </select>
                    </div>
                    <div style="font-size: 20px;">→</div>
                    <div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">TO</div>
                        <select id="toChain" onchange="updatePath()">
                            <option value="ink">⚪ INK</option>
                            <option value="giwa">🟣 GIWA</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Amount Input -->
            <div class="info-box"><strong>💰 Amount to Bridge:</strong></div>
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" oninput="calcOutput()">

            <!-- Fees -->
            <div class="info-box"><strong>🔧 Bridge Fee:</strong></div>
            <div class="fees">
                <button class="fee-btn active" onclick="setFee(0.00025, this)">0.025%</button>
                <button class="fee-btn" onclick="setFee(0.0005, this)">0.050%</button>
                <button class="fee-btn" onclick="setFee(0.00075, this)">0.075%</button>
                <button class="fee-btn" onclick="setFee(0.001, this)">0.1%</button>
            </div>

            <!-- Summary -->
            <div class="summary">
                <div class="summary-row">
                    <span>You Send:</span>
                    <strong><span id="sendAmount">0</span> <span id="sendSymbol">USDC</span></strong>
                </div>
                <div class="summary-row">
                    <span>You Receive:</span>
                    <strong style="color: var(--success);"><span id="receiveAmount">0</span> <span id="receiveSymbol">USDC</span></strong>
                </div>
                <div class="summary-row">
                    <span>Destination:</span>
                    <strong style="color: var(--primary);" id="destination">ARC → INK</strong>
                </div>
            </div>

            <!-- Bridge Button -->
            <button class="btn-action" onclick="executeBridge()">🌉 Bridge Now</button>

            <!-- Status -->
            <div id="status"></div>
        </div>
    </main>

    <script>
        // ============= CONSTANTS =============
        const ADDRESSES = {
            arc_usdc: '0x3600000000000000000000000000000000000000',
            arc_eurc: '0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a',
            ink_usdc: '0xFabab97dCE620294D2B0b0e46C68964e326300Ac',
            arc_bridge: '0xFcfe1D1BF3083ACf627d04c2Ca0cE0B43335fC2e',
            ink_bridge: '0x3422A8c40bADe21DB15FfB73a839aE25DC5A3f71',
            giwa_bridge: '0x56D390B0dB9fadEd9eeDD8Aab2b4a880FaF4435D'
        };

        const RPC = {
            arc: 'https://rpc.testnet.arc.network',
            ink: 'https://rpc-sepolia.inkonchain.com',
            giwa: 'https://sepolia-rpc.giwa.io'
        };

        const ERC20_ABI = ['function transfer(address to, uint256 amount) returns (bool)', 'function balanceOf(address account) returns (uint256)'];

        // ============= STATE =============
        let userAddress = null;
        let signer = null;
        let selectedToken = 'usdc';
        let currentFee = 0.00025;
        let balances = { usdc: 0n, eurc: 0n, ink_usdc: 0n };

        // ============= WALLET =============
        async function connectWallet() {
            try {
                if (!window.ethereum) {
                    alert('Please install MetaMask!');
                    return;
                }

                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                const provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();

                updateWalletUI();
                await loadBalances();

            } catch (error) {
                showStatus('error', 'Wallet connection failed: ' + error.message);
            }
        }

        function updateWalletUI() {
            const el = document.getElementById('walletAddress');
            if (userAddress) {
                el.textContent = userAddress;
                el.style.color = 'var(--success)';
                document.getElementById('connectBtn').textContent = 'Wallet Connected ✓';
                document.getElementById('connectBtn').style.background = 'var(--success)';
            }
        }

        // ============= BALANCES =============
        async function loadBalances() {
            if (!userAddress) return;

            try {
                const arcProvider = new ethers.JsonRpcProvider(RPC.arc);

                // ARC USDC
                const usdcContract = new ethers.Contract(ADDRESSES.arc_usdc, ERC20_ABI, arcProvider);
                balances.usdc = await usdcContract.balanceOf(userAddress);

                // ARC EURC
                const eurcContract = new ethers.Contract(ADDRESSES.arc_eurc, ERC20_ABI, arcProvider);
                balances.eurc = await eurcContract.balanceOf(userAddress);

                // INK USDC
                const inkProvider = new ethers.JsonRpcProvider(RPC.ink);
                const inkUsdcContract = new ethers.Contract(ADDRESSES.ink_usdc, ERC20_ABI, inkProvider);
                balances.ink_usdc = await inkUsdcContract.balanceOf(userAddress);

                console.log('✅ Balances loaded:', {
                    usdc: (Number(balances.usdc) / 1e6).toFixed(4),
                    eurc: (Number(balances.eurc) / 1e6).toFixed(4),
                    ink_usdc: (Number(balances.ink_usdc) / 1e6).toFixed(4)
                });

                updateBalance();
            } catch (error) {
                showStatus('error', 'Failed to load balances: ' + error.message);
            }
        }

        // ============= UI =============
        function selectToken(token, btn) {
            selectedToken = token;
            document.querySelectorAll('.token-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateBalance();
            calcOutput();
        }

        function updateBalance() {
            const balance = selectedToken === 'usdc' ? balances.usdc : balances.eurc;
            const symbol = selectedToken.toUpperCase();
            const emoji = selectedToken === 'usdc' ? '💵' : '🪙';

            document.getElementById('balanceLabel').textContent = `${emoji} ${symbol} Balance:`;
            document.getElementById('balanceAmount').textContent = (Number(balance) / 1e6).toFixed(4);
        }

        function updateChains() {
            updatePath();
            calcOutput();
        }

        function updatePath() {
            const from = document.getElementById('fromChain').value;
            const to = document.getElementById('toChain').value;
            const emojis = { arc: '🔵', ink: '⚪', giwa: '🟣' };
            const names = { arc: 'ARC', ink: 'INK', giwa: 'GIWA' };
            document.getElementById('destination').textContent = `${emojis[from]} ${names[from]} → ${emojis[to]} ${names[to]}`;
        }

        function setFee(fee, btn) {
            currentFee = fee;
            document.querySelectorAll('.fee-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            calcOutput();
        }

        function calcOutput() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const receive = amount * (1 - currentFee);
            const symbol = selectedToken.toUpperCase();

            document.getElementById('sendAmount').textContent = amount.toFixed(6);
            document.getElementById('sendSymbol').textContent = symbol;
            document.getElementById('receiveAmount').textContent = receive.toFixed(6);
            document.getElementById('receiveSymbol').textContent = symbol;
        }

        // ============= BRIDGE =============
        async function executeBridge() {
            if (!userAddress) {
                showStatus('error', 'Please connect wallet first!');
                return;
            }

            const amount = parseFloat(document.getElementById('amount').value) || 0;
            if (!amount) {
                showStatus('error', 'Enter amount!');
                return;
            }
            if (amount < 0.01) {
                showStatus('error', 'Min amount: 0.01 tokens');
                return;
            }

            const from = document.getElementById('fromChain').value;
            const to = document.getElementById('toChain').value;
            const symbol = selectedToken.toUpperCase();

            showStatus('loading', `Bridging ${amount} ${symbol} to ${to.toUpperCase()}...`);

            try {
                let tokenAddr, bridgeAddr;

                if (from === 'arc') {
                    tokenAddr = selectedToken === 'usdc' ? ADDRESSES.arc_usdc : ADDRESSES.arc_eurc;
                    bridgeAddr = ADDRESSES.arc_bridge;
                } else if (from === 'ink') {
                    tokenAddr = ADDRESSES.ink_usdc;
                    bridgeAddr = ADDRESSES.ink_bridge;
                } else {
                    tokenAddr = ADDRESSES.arc_usdc; // fallback
                    bridgeAddr = ADDRESSES.giwa_bridge;
                }

                const token = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
                const amountWei = ethers.parseUnits(amount.toString(), 6);

                const tx = await token.transfer(bridgeAddr, amountWei);
                await tx.wait();

                showStatus('success', `✅ Bridge successful! ${amount} ${symbol} bridged to ${to.toUpperCase()}`);
                document.getElementById('amount').value = '';
                calcOutput();
                await loadBalances();

            } catch (error) {
                showStatus('error', 'Bridge failed: ' + error.message.substring(0, 80));
            }
        }

        function showStatus(type, msg) {
            const el = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            el.innerHTML = '';
            el.appendChild(div);
            if (type !== 'loading') setTimeout(() => div.remove(), 5000);
        }

        // ============= INIT =============
        window.ethereum?.on('accountsChanged', (accounts) => {
            userAddress = accounts.length > 0 ? accounts[0] : null;
            if (userAddress) loadBalances();
            updateWalletUI();
        });
    </script>
</body>
</html>
